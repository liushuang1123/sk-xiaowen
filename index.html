<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sk小问 · 访谈追问助手</title>
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --border: #e4e4e7;
    --text: #18181b; --muted: #71717a; --accent: #185fa5; --accent-bg: #e6f1fb;
    --hl: #fff3a3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  button {
    display: inline-block; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 8px 20px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  input, textarea {
    font-family: inherit; font-size: 13px;
    border: 0.5px solid var(--border); border-radius: 8px;
  }
  textarea { width: 100%; padding: 10px; resize: vertical; background: #fafafa; }
  textarea:focus, input:focus { outline: 1.5px solid var(--accent); background: #fff; }
  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }

  /* ===== 顶栏 ===== */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: var(--card); border-bottom: 0.5px solid var(--border);
  }
  .topbar h1 { font-size: 16px; font-weight: 500; margin-right: 8px; }
  .topbar .sub { font-size: 12px; color: var(--muted); margin-right: auto; }
  .viewBtn { background: #eee; color: var(--text); padding: 6px 14px; font-size: 13px; }
  .viewBtn.active { background: var(--accent); color: #fff; }
  .linkBtn {
    background: none; color: var(--muted); padding: 6px 10px; font-size: 12px;
    text-decoration: underline;
  }
  .noticeStrip {
    background: #faeeda; border-bottom: 0.5px solid #ef9f27;
    padding: 6px 16px; font-size: 12px; color: #633806;
  }

  /* ===== 三栏布局（常驻） ===== */
  #workspace { height: 100vh; display: flex; flex-direction: column; }
  .layout { flex: 1; display: grid; grid-template-columns: 3fr 5fr 2fr; min-height: 0; }
  .pane { overflow-y: auto; padding: 14px; }
  #srcPane { background: #fcfcf9; border-right: 0.5px solid var(--border); display: flex; flex-direction: column; }
  #ctrlPane { background: var(--card); border-left: 0.5px solid var(--border); }
  .paneTitle {
    font-size: 12px; color: var(--muted); margin-bottom: 8px; letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px;
  }
  .paneTitle a { color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 12px; }

  /* 左栏 */
  #interviewText { flex: 1; min-height: 300px; font-size: 14px; line-height: 1.8; resize: none; }
  #srcText { font-size: 14px; white-space: pre-wrap; line-height: 1.9; }
  #srcText mark.hl { background: var(--hl); padding: 1px 0; border-radius: 3px; }

  /* 中栏 */
  .goalCard {
    background: var(--card); border: 0.5px solid var(--border); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 14px;
  }
  .goalCard summary {
    cursor: pointer; font-size: 13px; font-weight: 600; list-style: none;
    display: flex; align-items: center; gap: 6px;
  }
  .goalCard summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  .goalCard[open] summary::before { transform: rotate(90deg); }
  #goalBox { min-height: 58px; margin-top: 8px; }
  #goalActions { margin-top: 8px; display: flex; gap: 8px; align-items: center; }
  #goalText { font-size: 12px; color: var(--muted); margin-top: 6px; white-space: pre-wrap; }
  #emptyHint {
    border: 1px dashed var(--border); border-radius: 10px; padding: 28px 20px;
    text-align: center; color: var(--muted); font-size: 13px; line-height: 2;
  }
  #emptyHint b { color: var(--accent); }

  .secTitle { font-size: 13px; font-weight: 600; margin: 18px 0 8px; display: flex; align-items: center; gap: 6px; }
  .secTitle:first-child { margin-top: 0; }

  .top3 { background: #1f2937; color: #fff; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .top3 .rank { font-size: 12px; color: #fbbf24; font-weight: 600; }
  .top3 .qq { font-size: 14px; margin: 4px 0 2px; }
  .top3 .rs { font-size: 12px; color: #cbd5e1; }

  .gapItem {
    background: #fff; border: 0.5px dashed var(--accent); border-radius: 8px;
    padding: 8px 12px; font-size: 13px; margin-bottom: 8px;
  }
  .gapItem b { color: var(--accent); }

  details.topic { border: 0.5px solid var(--border); border-radius: 10px; background: var(--card); margin-bottom: 10px; }
  details.topic summary {
    padding: 10px 14px; cursor: pointer; font-size: 14px; font-weight: 600; list-style: none;
    display: flex; align-items: center; gap: 8px;
  }
  details.topic summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  details.topic[open] summary::before { transform: rotate(90deg); }
  .issueBody { padding: 0 14px 12px; }
  .quoteBox {
    background: #fafafa; border-left: 3px solid #d4d4d8; border-radius: 0 6px 6px 0;
    padding: 6px 10px; font-size: 12px; color: var(--muted); margin-bottom: 4px;
  }
  .quoteBox b.kw { color: var(--text); border-bottom: 1.5px dashed var(--accent); font-weight: 600; }
  .diagnosis { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .diagnosis::before { content: "诊断："; color: var(--accent); font-weight: 500; }

  .qcard {
    position: relative; background: #fff; border: 0.5px solid var(--border);
    border-left-width: 3px; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
  }
  .qcard:hover { box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .qtext { font-size: 14px; }
  .qmeta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 99px; }
  .t-clarify  { border-left-color: #d94f4f; }
  .t-detail   { border-left-color: #3b82f6; }
  .t-example  { border-left-color: #22a55f; }
  .t-dig      { border-left-color: #e8842c; }
  .t-compare  { border-left-color: #8b5cf6; }
  .sit { background: #f1f1f3; color: #52525b; }
  .sit-conflict { background: #fde3e3; color: #a32d2d; }
  .sit-vague    { background: #fdf3d1; color: #8a6a08; }
  .sit-short    { background: #e3edfd; color: #2b5ca8; }
  .sit-num      { background: #efe3fd; color: #6d3fb8; }
  .sit-open     { background: #e2f4e8; color: #1f7a45; }
  .qactions { display: none; position: absolute; top: 6px; right: 8px; gap: 6px; }
  .qcard:hover .qactions { display: flex; }
  .qactions button {
    background: #f1f1f3; color: var(--muted); font-size: 11px; padding: 2px 8px; border-radius: 6px;
  }
  .qactions button:hover { background: var(--accent-bg); color: var(--accent); }

  .skipItem { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .skipItem::before { content: "🚫 "; }
  .tipsBox, .nextBox, .remindBox {
    font-size: 12.5px; color: var(--muted); background: var(--card);
    border: 0.5px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
  }
  .remindBox { color: #633806; background: #faeeda; border-color: #ef9f27; }

  /* 剧本流 */
  .tlItem { display: flex; gap: 10px; margin-bottom: 14px; }
  .tlBadge {
    flex-shrink: 0; align-self: flex-start; background: var(--accent); color: #fff;
    font-size: 12px; border-radius: 99px; padding: 2px 12px; white-space: nowrap;
  }
  .tlContent {
    background: var(--card); border: 0.5px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; white-space: pre-wrap; flex: 1;
  }

  /* 右栏 */
  .ctrlBlock { margin-bottom: 16px; }
  .ctrlBlock h4 { font-size: 12px; color: var(--muted); margin-bottom: 8px; letter-spacing: 1px; }
  .toneOpt { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; margin-bottom: 6px; cursor: pointer; }
  .toneOpt input { margin-top: 3px; }
  .toneOpt small { display: block; color: var(--muted); font-size: 11px; }
  #globalInput { width: 100%; padding: 8px 10px; margin-bottom: 6px; }
  #globalBtn { width: 100%; }
  .statLine { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .alertBox {
    font-size: 12px; color: #a32d2d; background: #fde3e3; border-radius: 8px;
    padding: 8px 10px; margin-bottom: 8px;
  }
  #busy {
    position: fixed; inset: 0; background: rgba(255,255,255,.6); display: none;
    align-items: center; justify-content: center; font-size: 14px; color: var(--muted); z-index: 99;
  }
  #busy.on { display: flex; }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1f2937; color: #fff; font-size: 13px; border-radius: 8px;
    padding: 8px 16px; display: none; z-index: 100;
  }
  #err { color: #a32d2d; font-size: 12.5px; margin-top: 6px; display: none; white-space: pre-wrap; }

  @media (max-width: 980px) {
    #workspace { height: auto; min-height: 100vh; }
    .layout { display: block; }
    #srcPane { max-height: 320px; border-right: none; border-bottom: 0.5px solid var(--border); }
    #ctrlPane { border-left: none; border-top: 0.5px solid var(--border); }
    #interviewText { min-height: 160px; }
  }
</style>
</head>
<body>

<div id="workspace">
  <div class="topbar">
    <h1>sk小问</h1>
    <span class="sub">访谈追问助手 · 原文溯源 / 必问 Top3 / 访谈剧本</span>
    <button class="viewBtn active" id="btnDefault" onclick="switchView('default')" disabled>默认输出</button>
    <button class="viewBtn" id="btnScript" onclick="switchView('script')" disabled>访谈剧本流</button>
    <button class="linkBtn" onclick="restart()">↺ 清空重来</button>
  </div>
  <div class="noticeStrip">隐私提醒：上传前请删除访谈文本中的真实姓名、电话、住址等个人信息（用“受访者A”等代替）。</div>

  <div class="layout">
    <!-- 左栏：原文 / 溯源区 -->
    <aside class="pane" id="srcPane">
      <div class="paneTitle">① 初访原文 <a id="editSrcLink" style="display:none" onclick="editSource()">✎ 编辑</a></div>
      <textarea id="interviewText" placeholder="在此粘贴整理好的初次访谈文本……&#10;&#10;填好后在中间栏填写研究目标，点击“生成追问”。"></textarea>
      <div id="srcText" style="display:none"></div>
    </aside>

    <!-- 中栏：主工作区 -->
    <main class="pane" id="mainPane">
      <details class="goalCard" id="goalDetails" open>
        <summary>② 研究目标（本次调研想弄清楚什么问题？）</summary>
        <textarea id="goalBox" placeholder="例如：了解外卖骑手的工作时间安排及其对生活的影响"></textarea>
        <div id="goalActions">
          <button id="startBtn" onclick="startGenerate()">生成追问</button>
          <span id="goalText"></span>
        </div>
        <div id="err"></div>
      </details>

      <div id="emptyHint">
        <b>生成后这里会出现</b><br>
        🎯 本次必问 Top 3　·　🕳️ 初访信息盲区<br>
        🔍 按议题分组的问题点（原文摘录 → 诊断 → 追问）<br>
        悬停任一条追问，左侧原文会自动高亮定位对应片段
      </div>

      <div id="defaultView"></div>
      <div id="scriptView" style="display:none"></div>
    </main>

    <!-- 右栏：控制与策略台 -->
    <aside class="pane" id="ctrlPane">
      <div class="ctrlBlock">
        <h4>语气模式</h4>
        <label class="toneOpt"><input type="radio" name="tone" value="neutral" checked onchange="setTone('neutral')">
          <span>中性规范<small>直接使用规范话术提问（默认）</small></span></label>
        <label class="toneOpt"><input type="radio" name="tone" value="empathetic" onchange="setTone('empathetic')">
          <span>共情模式<small>先简短承接受访者处境，再引出问题</small></span></label>
        <label class="toneOpt"><input type="radio" name="tone" value="direct" onchange="setTone('direct')">
          <span>直接模式<small>问句简短直接、直指要点</small></span></label>
      </div>
      <div class="ctrlBlock">
        <h4>全局微调</h4>
        <input id="globalInput" placeholder="例如：去掉所有关于家庭的问题" onkeydown="if(event.key==='Enter')sendGlobal()">
        <button id="globalBtn" onclick="sendGlobal()">发送调整</button>
      </div>
      <div class="ctrlBlock">
        <h4>手法自检（自动统计）</h4>
        <div id="statBox"><div class="statLine">生成后自动统计</div></div>
      </div>
      <div class="ctrlBlock">
        <h4>伦理提醒</h4>
        <div id="alertBox"><div class="statLine">生成后显示</div></div>
      </div>
      <div class="ctrlBlock">
        <h4>访谈现场提示</h4>
        <div id="tipsBox"><div class="statLine">生成后显示</div></div>
      </div>
    </aside>
  </div>
</div>

<div id="busy">正在生成，请稍候……</div>
<div id="toast"></div>

<script>
/* ================= 状态 ================= */
let state = { data: null, history: [], tone: 'neutral', sourceText: '', busy: false };
const TONES = ['neutral', 'empathetic', 'direct'];
const TONE_NAME = { neutral: '中性规范', empathetic: '共情', direct: '直接' };

/* ================= 工具 ================= */
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._tm); t._tm = setTimeout(() => t.style.display = 'none', 2200);
}
function showBusy(on) { state.busy = on; document.getElementById('busy').classList.toggle('on', on); }
function showErr(msg) {
  const e = document.getElementById('err');
  if (!msg) { e.style.display = 'none'; return; }
  e.textContent = msg; e.style.display = 'block';
}
function parseJSON(txt) {
  try { return JSON.parse(txt); } catch (_) {}
  const m = String(txt).match(/\{[\s\S]*\}/);
  if (m) { try { return JSON.parse(m[0]); } catch (_) {} }
  return null;
}

/* ================= API ================= */
async function callAPI(messages) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, tone: state.tone })
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
  return j.choices[0].message.content;
}

/* ================= 生成 ================= */
async function startGenerate() {
  const text = document.getElementById('interviewText').value.trim();
  const goal = document.getElementById('goalBox').value.trim();
  showErr('');
  if (!text || !goal) { showErr('请先填写左侧的初访原文和这里的研究目标'); return; }
  state.sourceText = text;
  state.history = [{ role: 'user', content: `【研究目标】\n${goal}\n\n【初次访谈整理文本】\n${text}` }];
  await runAndRender('生成中');
  if (state.data) {
    document.getElementById('goalDetails').removeAttribute('open');
    document.getElementById('goalText').textContent = '研究目标：' + goal;
  }
}
async function runAndRender(busyText) {
  if (state.busy) return;
  document.getElementById('busy').textContent = busyText + '，请稍候……';
  showBusy(true);
  try {
    const raw = await callAPI(state.history);
    const data = parseJSON(raw);
    if (!data) throw new Error('模型返回的不是有效 JSON，请重试一次');
    state.data = data;
    state.history.push({ role: 'assistant', content: raw });
    renderAll();
  } catch (e) {
    showErr('生成失败：' + e.message);
  } finally {
    showBusy(false);
  }
  return state.data;
}

/* ================= 视图状态 ================= */
function editSource() {
  document.getElementById('srcText').style.display = 'none';
  document.getElementById('interviewText').style.display = 'block';
  document.getElementById('editSrcLink').style.display = 'none';
  document.getElementById('goalDetails').setAttribute('open', '');
  toast('修改原文后请重新点击“生成追问”');
}
function clearResults() {
  state.data = null;
  state.history = [];
  document.getElementById('defaultView').innerHTML = '';
  document.getElementById('scriptView').innerHTML = '';
  document.getElementById('emptyHint').style.display = 'block';
  document.getElementById('statBox').innerHTML = '<div class="statLine">生成后自动统计</div>';
  document.getElementById('alertBox').innerHTML = '<div class="statLine">生成后显示</div>';
  document.getElementById('tipsBox').innerHTML = '<div class="statLine">生成后显示</div>';
  document.getElementById('btnDefault').disabled = true;
  document.getElementById('btnScript').disabled = true;
  document.getElementById('goalText').textContent = '';
  switchView('default');
  showErr('');
}
function restart() {
  if (state.data && !confirm('清空当前结果，重新开始？')) return;
  clearResults();
  document.getElementById('interviewText').value = '';
  document.getElementById('goalBox').value = '';
  document.getElementById('srcText').style.display = 'none';
  document.getElementById('interviewText').style.display = 'block';
  document.getElementById('editSrcLink').style.display = 'none';
  document.getElementById('goalDetails').setAttribute('open', '');
  document.getElementById('globalInput').value = '';
}
function switchView(v) {
  document.getElementById('defaultView').style.display = v === 'default' ? 'block' : 'none';
  document.getElementById('scriptView').style.display = v === 'script' ? 'block' : 'none';
  document.getElementById('btnDefault').classList.toggle('active', v === 'default');
  document.getElementById('btnScript').classList.toggle('active', v === 'script');
}

/* ================= 左栏原文高亮 ================= */
function renderSource(quote) {
  const el = document.getElementById('srcText');
  const txt = state.sourceText;
  let html = esc(txt);
  if (quote) {
    const i = txt.indexOf(quote);
    if (i >= 0) {
      html = esc(txt.slice(0, i)) + '<mark class="hl" id="hlMark">' + esc(txt.slice(i, i + quote.length)) + '</mark>' + esc(txt.slice(i + quote.length));
    } else {
      toast('未能在原文中定位该摘录');
    }
  }
  el.innerHTML = html;
  const m = document.getElementById('hlMark');
  if (m) m.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function clearHighlight() { renderSource(''); }

/* ================= 渲染 ================= */
const SIT_CLASS = { '前后矛盾':'sit-conflict','回答模糊':'sit-vague','过于简短':'sit-short','答非所问':'sit-short','数字时间不清':'sit-num','未展开':'sit-open' };
const TYPE_CLASS = { '澄清':'t-clarify','详述':'t-detail','举例':'t-example','对比':'t-compare','深挖':'t-dig' };

function markKeywords(quote, keywords) {
  let s = esc(quote);
  (keywords || []).forEach(k => {
    if (!k) return;
    const e = esc(k);
    if (s.indexOf(e) >= 0) s = s.split(e).join('<b class="kw">' + e + '</b>');
  });
  return s;
}
function qTags(q) {
  let h = '';
  if (q.type && TYPE_CLASS[q.type]) h += `<span class="tag sit">${esc(q.type)}型</span>`;
  if (q.situation) h += `<span class="tag ${SIT_CLASS[q.situation] || 'sit'}">${esc(q.situation)}</span>`;
  return h;
}
function questionCard(issueIdx, qIdx, q) {
  return `<div class="qcard ${q.type && TYPE_CLASS[q.type] ? TYPE_CLASS[q.type] : ''}"
    onmouseenter="renderSource(state.data.issues[${issueIdx}].quote)"
    onmouseleave="clearHighlight()">
    <div class="qtext">${esc(q.text)}</div>
    <div class="qmeta">${qTags(q)}</div>
    <div class="qactions">
      <button title="换一种问法" onclick="event.stopPropagation();cardAction(${issueIdx},${qIdx},'rephrase')">🔄 换个问法</button>
      <button title="切换语气" onclick="event.stopPropagation();cardAction(${issueIdx},${qIdx},'tone')">🗣️ 换语气</button>
    </div>
  </div>`;
}

function renderAll() {
  const d = state.data;
  document.getElementById('emptyHint').style.display = 'none';
  document.getElementById('interviewText').style.display = 'none';
  document.getElementById('srcText').style.display = 'block';
  document.getElementById('editSrcLink').style.display = 'inline';
  document.getElementById('btnDefault').disabled = false;
  document.getElementById('btnScript').disabled = false;

  const V = document.getElementById('defaultView');
  let h = '';

  (d.alerts || []).forEach(a => { h += `<div class="remindBox">⚠️ ${esc(a)}</div>`; });

  if ((d.top3 || []).length) {
    h += `<div class="secTitle">🎯 本次必问 Top ${d.top3.length}</div>`;
    d.top3.forEach((t, i) => {
      h += `<div class="top3"><div class="rank">必问 ${i + 1}</div><div class="qq">${esc(t.question)}</div><div class="rs">${esc(t.reason)}</div></div>`;
    });
  }

  if ((d.gaps || []).length) {
    h += `<div class="secTitle">🕳️ 初访信息盲区（研究目标未覆盖）</div>`;
    d.gaps.forEach(g => { h += `<div class="gapItem"><b>${esc(g.dimension)}</b>：${esc(g.question)}</div>`; });
  }

  if ((d.issues || []).length) {
    h += `<div class="secTitle">🔍 从初访文本中发现的问题点</div>`;
    d.issues.forEach((iss, i) => {
      h += `<details class="topic" ${i === 0 ? 'open' : ''}><summary>${esc(iss.topic)}<span class="tag sit">${iss.questions.length} 条追问</span></summary><div class="issueBody">
        <div class="quoteBox">原文：${markKeywords(iss.quote, iss.keywords)}</div>
        <div class="diagnosis">${esc(iss.diagnosis)}</div>
        ${iss.questions.map((q, j) => questionCard(i, j, q)).join('')}
      </div></details>`;
    });
  }

  if ((d.skipped || []).length) {
    h += `<div class="secTitle">本次跳过的话题</div>`;
    d.skipped.forEach(s => { h += `<div class="skipItem"><b>${esc(s.topic)}</b>——${esc(s.reason)}</div>`; });
  }

  if (d.next_step) h += `<div class="nextBox">💡 <b>下一步建议：</b>${esc(d.next_step)}</div>`;
  if (d.reminders) h += `<div class="remindBox">ℹ️ ${esc(d.reminders)}</div>`;

  V.innerHTML = h;

  const S = document.getElementById('scriptView');
  let sh = `<div class="secTitle">📋 访谈剧本（按时间线，可照着念）</div>`;
  (d.script || []).forEach(st => {
    sh += `<div class="tlItem"><div class="tlBadge">${esc(st.phase)}</div><div class="tlContent">${esc(st.content)}</div></div>`;
  });
  sh += d.reminders ? `<div class="remindBox">ℹ️ ${esc(d.reminders)}</div>` : '';
  S.innerHTML = sh;

  renderSource('');

  const counts = {};
  let total = 0;
  (d.issues || []).forEach(iss => (iss.questions || []).forEach(q => { total++; if (q.type) counts[q.type] = (counts[q.type] || 0) + 1; }));
  (d.gaps || []).forEach(g => { if (g.question) { total++; counts['缺口'] = (counts['缺口'] || 0) + 1; } });
  let st = total ? Object.entries(counts).map(([k, v]) => `<div class="statLine">${esc(k)}：×${v}</div>`).join('') : '<div class="statLine">本次没有生成追问</div>';
  document.getElementById('statBox').innerHTML = st + `<div class="statLine">合计 ${total} 条</div>`;

  document.getElementById('alertBox').innerHTML =
    (d.alerts || []).map(a => `<div class="alertBox">⚠️ ${esc(a)}</div>`).join('') +
    (d.reminders ? `<div class="statLine">${esc(d.reminders)}</div>` : '') ||
    '<div class="statLine">本次无特殊提醒</div>';
  document.getElementById('tipsBox').innerHTML = d.tips ? esc(d.tips).replace(/\n/g, '<br>') : '<div class="statLine">无</div>';
}

/* ================= 微调 ================= */
function setTone(tone) {
  if (tone === state.tone) return;
  state.tone = tone;
  if (!state.data) { toast('已选择' + TONE_NAME[tone] + '模式，将在生成时生效'); return; }
  state.history.push({ role: 'user', content: `请将全部追问的语气调整为${TONE_NAME[tone]}模式：内容要点保持不变，只调整措辞风格。返回完整 JSON。` });
  runAndRender('调整语气中').then(() => toast('已切换为' + TONE_NAME[tone] + '模式'));
}
function sendGlobal() {
  const inp = document.getElementById('globalInput');
  const msg = inp.value.trim();
  if (!msg) return;
  if (!state.data) { toast('请先生成追问'); return; }
  inp.value = '';
  state.history.push({ role: 'user', content: msg + '（请基于当前清单修改后返回完整 JSON，未涉及的内容保持不变）' });
  runAndRender('调整中');
}
function cardAction(issueIdx, qIdx, kind) {
  if (!state.data || state.busy) return;
  const iss = state.data.issues[issueIdx];
  const q = iss.questions[qIdx];
  let msg;
  if (kind === 'rephrase') {
    msg = `请只把这条追问换一种问法（目标不变、保持中性非导向，措辞与原来明显不同）："${q.text}"（议题：${iss.topic}）。其余所有内容保持不变，返回完整 JSON。`;
  } else {
    const next = TONES[(TONES.indexOf(state.tone) + 1) % TONES.length];
    state.tone = next;
    document.querySelectorAll('input[name=tone]').forEach(r => r.checked = r.value === next);
    msg = `请只把这条追问改为${TONE_NAME[next]}模式的问法："${q.text}"（议题：${iss.topic}）。其余所有内容保持不变，返回完整 JSON。`;
  }
  state.history.push({ role: 'user', content: msg });
  runAndRender('微调中').then(() => toast('该条已更新'));
}
</script>
